info:
  name: Create a room
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:3000/api/rooms
  body:
    type: json
    data: |-
      {
        "name": "Bedroom"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
